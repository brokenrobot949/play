<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play — Rob's Games</title>
<meta name="description" content="All of Rob's browser games in one place.">
<meta name="theme-color" content="#0f0d17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffb547'/%3E%3Cpath d='M24 18 L48 32 L24 46 Z' fill='%230f0d17'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0d17;
    --bg-glow: #221a3a;
    --card: #1a1726;
    --card-edge: #2c2740;
    --text: #f3eefc;
    --muted: #a59fbd;
    --accent: #ffb547;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 50% -200px, var(--bg-glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: "Nunito", system-ui, sans-serif;
    line-height: 1.5;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 56px 16px 40px;
  }

  header { text-align: center; margin-bottom: 44px; }

  h1 {
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 8vw, 4rem);
    letter-spacing: 0.02em;
    margin: 0;
  }
  h1 span { color: var(--accent); }

  header p {
    color: var(--muted);
    margin: 8px 0 0;
    font-size: 1.1rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }

  .game {
    --c: var(--accent);
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 18px;
    padding: 22px;
    color: inherit;
    text-decoration: none;
    overflow: hidden;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .game::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 5px;
    background: var(--c);
  }
  .game:hover, .game:focus-visible {
    transform: translateY(-4px);
    border-color: var(--c);
    box-shadow: 0 12px 32px -12px var(--c);
    outline: none;
  }

  .icon {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    margin-bottom: 16px;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--c) 22%, transparent);
    color: var(--c);
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    font-size: 2.2rem;
    overflow: hidden;
  }
  .icon img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }

  .game h2 {
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    font-size: 1.45rem;
    margin: 0 0 4px;
  }
  .genre {
    color: var(--c);
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .game p {
    color: var(--muted);
    margin: 0 0 20px;
    flex: 1;
  }

  .play {
    align-self: flex-start;
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    background: var(--c);
    color: #14111d;
    padding: 8px 18px;
    border-radius: 999px;
  }

  .soon { opacity: 0.6; }
  .soon:hover { transform: none; box-shadow: none; border-color: var(--card-edge); }
  .soon .play { background: transparent; color: var(--c); border: 1px dashed var(--c); }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 48px;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Let's <span>Play</span></h1>
    <p>Pick a game. Everything runs right in your browser.</p>
  </header>

  <main class="grid" id="games"></main>

  <footer>
    Made by <a href="https://github.com/brokenrobot949">brokenrobot949</a>
  </footer>
</div>

<script>
  // To add a new game, add an entry here. "icon" is optional;
  // without one, the card shows the game's first letter instead.
  const GAMES = [
    {
      name: "Questbound",
      genre: "Fantasy RPG",
      blurb: "A single-player fantasy adventure where the game itself is your Dungeon Master.",
      url: "https://brokenrobot949.github.io/questbound/",
      icon: "https://brokenrobot949.github.io/questbound/assets/ui/icon-192.png",
      color: "#7aa2ff",
    },
    {
      name: "Whimsywild RP5",
      genre: "Roguelite RPG",
      blurb: "Each hero gets a five-minute life. Over many lives, uncover the world above a sleeping dragon.",
      url: "https://brokenrobot949.github.io/whimsywild-rp5/",
      color: "#6ee7a8",
    },
    {
      name: "PetCraft",
      genre: "Cozy idle",
      blurb: "Raise evolving monster pets, harvest, craft and grow your homestead.",
      url: "https://brokenrobot949.github.io/petcraft/",
      icon: "https://brokenrobot949.github.io/petcraft/assets/icons/icon-192.png",
      color: "#ffb547",
    },
    {
      name: "Demonwake",
      genre: "Idle ARPG",
      blurb: "Pick a zone, send your hero in, and come back later for the loot.",
      url: "https://brokenrobot949.github.io/demonwake/",
      color: "#ff6b6b",
    },
    {
      name: "Infernus",
      genre: "Dark fantasy",
      blurb: "A dark star fell and split the earth open. Descend.",
      url: "https://brokenrobot949.github.io/infernus/",
      color: "#ff7a3d",
    },
    {
      name: "Banner & Keep",
      genre: "Fantasy strategy",
      blurb: "Lead your heroes out from the keep. Wounds heal, but the scars stay with them.",
      url: "https://brokenrobot949.github.io/BANNERandKEEP/",
      color: "#c9a227",
    },
    {
      name: "Endless Arena",
      genre: "Arena battler",
      blurb: "Choose from over twenty battle classes and see how long you last in the arena.",
      url: "https://brokenrobot949.github.io/arena/",
      color: "#4f7bff",
    },
    {
      name: "LFG — Guildmaster",
      genre: "Idle guild sim",
      blurb: "Build a guild of adventurers that keeps going while you're away.",
      url: "https://brokenrobot949.github.io/lfg/",
      color: "#b884d8",
    },
    {
      // No url yet, so the card shows "Coming soon" instead of a Play button.
      name: "Adventure Index",
      genre: "Coming soon",
      blurb: "A new adventure in the works.",
      color: "#5fbfa8",
    },
  ];

  const grid = document.getElementById("games");
  for (const g of GAMES) {
    const card = document.createElement(g.url ? "a" : "div");
    card.className = g.url ? "game" : "game soon";
    if (g.url) card.href = g.url;
    card.style.setProperty("--c", g.color);

    const icon = document.createElement("div");
    icon.className = "icon";
    icon.textContent = g.name[0];
    if (g.icon) {
      const img = new Image();
      img.alt = "";
      img.onload = () => icon.replaceChildren(img);
      img.src = g.icon;
    }

    card.append(icon);
    card.insertAdjacentHTML("beforeend", `
      <h2></h2>
      <div class="genre"></div>
      <p></p>
      <span class="play">${g.url ? "Play &rarr;" : "Coming soon"}</span>`);
    card.querySelector("h2").textContent = g.name;
    card.querySelector(".genre").textContent = g.genre;
    card.querySelector("p").textContent = g.blurb;
    grid.append(card);
  }
</script>
</body>
</html>
